name: Bug report
description: Report incorrect diagnostics, crashes, or security-safe reproduction failures.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste credentials, tokens, private keys, or unredacted production configuration.
  - type: input
    id: version
    attributes:
      label: DevDoctor version
      placeholder: devdoctor version
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Homebrew formula
        - Source build
        - Release archive
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected diagnosis or behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual diagnosis or behavior
      description: Include only sanitized output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true
