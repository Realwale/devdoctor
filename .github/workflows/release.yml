name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Intel macOS release
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate release tag
        shell: bash
        run: |
          expected="v$(tr -d '[:space:]' < packaging/VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Expected tag $expected, received $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build release archive and public formula
        env:
          DEVDOCTOR_HOMEPAGE_URL: https://github.com/${{ github.repository }}
          DEVDOCTOR_RELEASE_URL_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: ./packaging/build-homebrew-release.sh outputs
      - name: Verify archive checksum
        run: cd outputs && shasum -a 256 -c SHA256SUMS
      - name: Verify bundled runtime
        shell: bash
        run: |
          mkdir release-check
          tar -xzf outputs/devdoctor-*-macos-x86_64.tar.gz -C release-check
          release-check/runtime/bin/java -jar release-check/devdoctor.jar version
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          outputs/devdoctor-*-macos-x86_64.tar.gz
          outputs/devdoctor.rb
          outputs/SHA256SUMS
          --generate-notes
          --title "DevDoctor $GITHUB_REF_NAME"
